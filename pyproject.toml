[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indodax-py"
version = "1.0.1"
description = "Standalone Python SDK for Official Indodax Trade API v2."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    { name = "MinatoAka" }
]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=1.26.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "requests-mock>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
